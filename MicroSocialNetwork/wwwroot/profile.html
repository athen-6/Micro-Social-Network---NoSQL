<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MiniSocial - Trang cá nhân</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<div class="app-shell">


   

    <aside class="sidebar">

        <div class="brand">

            <span class="brand-icon">
                M
            </span>

            <span>
                MiniSocial
            </span>

        </div>


        <nav>

            <a class="nav-item"
               href="index.html">

                <span><i class="fa-solid fa-house"></i></span>
                Bảng tin

            </a>


            <a class="nav-item active"
               href="profile.html">

                <span><i class="fa-solid fa-user"></i></span>
                Trang cá nhân

            </a>


            <a class="nav-item"
               href="friends.html">

                <span><i class="fa-solid fa-user-group"></i></span>
                Bạn bè

            </a>


            <a class="nav-item"
               href="recommendation.html">

                <span><i class="fa-solid fa-lightbulb"></i></span>
                Gợi ý

            </a>



        </nav>


        <div class="sidebar-footer">
            © 2026 MiniSocial
        </div>

    </aside>



  

    <main class="main-area">


     

        <header class="topbar">

            <h1>
                Trang cá nhân
            </h1>


            <div class="top-actions">

                <div class="user-mini" id="profileUserMini" style="cursor:pointer;">

                    <span class="avatar avatar-sm">
                        D
                    </span>

                    <b>
                        Duyên
                    </b>

                </div>

            </div>

        </header>



        <div class="profile-wrap">


           

            <div class="profile-cover">
            </div>



           

            <div class="profile-card card">


                <div class="profile-head">


                    <div class="avatar avatar-xl profile-avatar">
                        D
                    </div>


                    <div class="profile-info">

                        <h2>
                            Tạ Thị Hương Duyên
                        </h2>

                        <div class="profile-meta">

                            ⌖ Hà Nội

                            &nbsp;&nbsp;

                            ◷ Tham gia tháng 3, 2023

                        </div>

                    </div>


                    <div class="profile-buttons">

                        <button class="outline-btn" id="editProfileBtn" type="button">
                            Chỉnh sửa trang cá nhân
                        </button>

                        <button class="outline-btn" id="followProfileBtn" type="button" hidden>
                            Theo dõi
                        </button>
                        <button id="addFriendBtn" class="primary-btn" type="button" hidden>Kết bạn</button>

                        <button class="primary-btn" id="profileAddPostBtn" type="button">
                            Thêm tin
                        </button>

                    </div>

                </div>



               

                <div class="stats">

                    <div>
                        <b id="profilePostCount">0</b>
                        <span>Bài viết</span>
                    </div>


                    <div>
                        <b id="profileFriendCount">0</b>
                        <span>Bạn bè</span>
                    </div>


                    <div>
                        <b id="profileFollowerCount">0</b>
                        <span>Người theo dõi</span>
                    </div>


                    <div>
                        <b id="profileFollowingCount">0</b>
                        <span>Đang theo dõi</span>
                    </div>

                </div>

            </div>



           

            <div class="profile-lower single-column">

                <section>

                    <div class="tabs card">

                        <button class="tab active" type="button" data-tab="posts">
                            Bài viết
                        </button>

                        <button class="tab" type="button" data-tab="intro">
                            Giới thiệu
                        </button>

                        <button class="tab" type="button" data-tab="friends">
                            Bạn bè
                        </button>

                        <button class="tab" type="button" data-tab="images">
                            Ảnh
                        </button>

                        <button class="tab" type="button" data-tab="videos">
                            Video
                        </button>

                        <button class="tab" type="button" data-tab="likes">
                            Lượt thích
                        </button>

                    </div>

                    <div id="profilePosts"></div>

                </section>

            </div>

        </div>

    </main>

</div>

<script src="js/api.js"></script>
<script src="js/profile.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const api = window.socialApi;
        const isLoggedIn = api && api.getCurrentUser() && api.getCurrentUser().username;
        
        const profileLink = document.querySelector('a[href="profile.html"]');
        const friendsLink = document.querySelector('a[href="friends.html"]');
        
        if (!isLoggedIn) {
            if (profileLink) profileLink.classList.add('disabled');
            if (friendsLink) friendsLink.classList.add('disabled');
            
            if (profileLink) {
                profileLink.addEventListener('click', function (e) {
                    e.preventDefault();
                    api.renderLoginModal();
                });
            }
            
            if (friendsLink) {
                friendsLink.addEventListener('click', function (e) {
                    e.preventDefault();
                    api.renderLoginModal();
                });
            }
        }
    });
</script>

</body>
</html>
