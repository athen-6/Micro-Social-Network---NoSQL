<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MiniSocial - Tìm kiếm
    </title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<div class="app-shell">


    

    <aside class="sidebar">

        <div class="brand">

            <span class="brand-icon">
                M
            </span>

            <span>
                MiniSocial
            </span>

        </div>


        <nav>

            <a class="nav-item"
               href="index.html">

                <span><i class="fa-solid fa-house"></i></span>
                Bảng tin

            </a>


            <a class="nav-item"
               href="profile.html">

                <span><i class="fa-solid fa-user"></i></span>
                Trang cá nhân

            </a>


            <a class="nav-item"
               href="friends.html">

                <span><i class="fa-solid fa-user-group"></i></span>
                Bạn bè

            </a>


            <a class="nav-item active"
               href="recommendation.html">

                <span><i class="fa-solid fa-lightbulb"></i></span>
                Gợi ý

            </a>


            

        </nav>


        <div class="sidebar-footer">
            © 2026 MiniSocial
        </div>

    </aside>



   

    <main class="main-area">


        <header class="topbar">

            <h1>
                Gợi ý bạn bè
            </h1>


            <div class="top-actions">

                <div class="user-mini">

                    <span class="avatar avatar-sm">
                        D
                    </span>

                    <b>
                        Duyên
                    </b>

                </div>

            </div>

        </header>



        <div class="search-layout single-column">

            <section>

                <div class="search-box large">

                    ⌕

                    <input
                        id="searchInput"
                        placeholder="Tìm bạn bè..."
                    >

                </div>

                <div class="card search-results">

                    <h3>
                        Gợi ý bạn bè
                    </h3>

                    <div id="searchResults">
                    </div>

                </div>

            </section>

        </div>

    </main>

</div>


<script src="js/api.js"></script>
<script src="js/recommendation.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const api = window.socialApi;
        const isLoggedIn = api && api.getCurrentUser() && api.getCurrentUser().username;
        
        const profileLink = document.querySelector('a[href="profile.html"]');
        const friendsLink = document.querySelector('a[href="friends.html"]');
        
        if (!isLoggedIn) {
            if (profileLink) profileLink.classList.add('disabled');
            if (friendsLink) friendsLink.classList.add('disabled');
            
            if (profileLink) {
                profileLink.addEventListener('click', function (e) {
                    e.preventDefault();
                    api.renderLoginModal();
                });
            }
            
            if (friendsLink) {
                friendsLink.addEventListener('click', function (e) {
                    e.preventDefault();
                    api.renderLoginModal();
                });
            }
        }
    });
</script>

</body>
</html>
