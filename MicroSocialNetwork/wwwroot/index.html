<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniSocial - Bảng tin</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app-shell">

   
    <aside class="sidebar">

        <div class="brand">
            <span class="brand-icon">M</span>
            <span>MiniSocial</span>
        </div>

        <nav>

            <a class="nav-item active" href="index.html">
                <span><i class="fa-solid fa-house"></i></span>
                Bảng tin
            </a>

            <a class="nav-item" href="profile.html">
                <span><i class="fa-solid fa-user"></i></span>
                Trang cá nhân
            </a>

            <a class="nav-item" href="friends.html">
                <span><i class="fa-solid fa-user-group"></i></span>
                Bạn bè
            </a>

            <a class="nav-item" href="recommendation.html">
                <span><i class="fa-solid fa-lightbulb"></i></i></span>
                Gợi ý
            </a>

            

           

        </nav>

        <div class="sidebar-footer">
            © 2026 MiniSocial
        </div>

    </aside>


  
    <main class="main-area">

        <!-- HEADER -->
        <header class="topbar">

            <h1>Bảng tin</h1>

            <div class="top-actions">

                <div class="search-mini">
                    ⌕
                    <input id="globalSearch"
                           type="text"
                           placeholder="Tìm kiếm bạn bè...">
                    <div id="globalSearchResults" class="global-search-results" hidden></div>
                </div>

                <button class="notification-btn" type="button" aria-label="Thông báo" style="position: relative; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #555;">
                    <i class="fa-solid fa-bell"></i>
                    <!-- Cục tròn màu đỏ chứa con số, mặc định bị ẩn đi (display: none) -->
                    <span id="friendRequestBadge" style="position: absolute; top: -5px; right: -8px; background: #e41e3f; color: white; border-radius: 50px; font-size: 0.7rem; padding: 2px 6px; font-weight: bold; display: none; border: 2px solid white;">0</span>
                </button>

                <div class="user-mini">

                    <span class="avatar avatar-sm">
                        D
                    </span>

                    <b>Duyên</b>

                </div>

            </div>

        </header>


       
        <div class="content-grid">

           
            <section class="feed-column" style="width: 100%; max-width: 100%;">


                <!-- TẠO BÀI VIẾT -->
                <div class="card composer">

                    <div class="composer-row">

                        <span class="avatar" id="composerUserAvatar">
                            D
                        </span>

                        <input
                            id="postInput"
                            type="text"
                            placeholder="Bạn đang nghĩ gì?"
                        >

                    </div>


                    <div class="composer-tools">

                        <button type="button" id="feedImageButton">
                            ▧ Ảnh / Video
                        </button>

                        <button type="button" id="feedEmojiButton">
                            ☺ Cảm xúc
                        </button>

                        <button
                            class="primary-btn"
                            id="postBtn"
                            type="button"
                        >
                            Đăng bài
                        </button>

                    </div>

                    <input id="feedImageInput" type="file" accept="image/*,video/*" hidden>

                    <div id="feedEmojiList" class="feed-emoji-list">
                        <button type="button">😀</button>
                        <button type="button">😂</button>
                        <button type="button">😍</button>
                        <button type="button">🥰</button>
                        <button type="button">😎</button>
                        <button type="button">😊</button>
                        <button type="button">❤️</button>
                        <button type="button">👍</button>
                    </div>

                </div>


              
                <div id="feed"></div>

            </section>

        </div>

    </main>

</div>


<script src="js/api.js"></script>
<script src="js/feed.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const api = window.socialApi;
        const isLoggedIn = api && api.getCurrentUser() && api.getCurrentUser().username;
        
        const profileLink = document.querySelector('a[href="profile.html"]');
        const friendsLink = document.querySelector('a[href="friends.html"]');
        
        if (!isLoggedIn) {
            if (profileLink) profileLink.classList.add('disabled');
            if (friendsLink) friendsLink.classList.add('disabled');
            
            if (profileLink) {
                profileLink.addEventListener('click', function (e) {
                    e.preventDefault();
                    api.renderLoginModal();
                });
            }
            
            if (friendsLink) {
                friendsLink.addEventListener('click', function (e) {
                    e.preventDefault();
                    api.renderLoginModal();
                });
            }
        }
    });
</script>

</body>
</html>
